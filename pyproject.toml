[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pep-admet-engine"
version = "0.1.0"
description = "In-silico ADMET profiling and rational stabilization advisor for therapeutic peptides."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Juan José Álvarez Morales", email = "jjalvarezm77@gmail.com" }
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
]

[project.urls]
Homepage = "https://github.com/Juanj053/pep-admet-engine"
Repository = "https://github.com/Juanj053/pep-admet-engine"
LinkedIn = "https://www.linkedin.com/in/juanj-alva"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
workflow = [
    "snakemake>=8.0.0",
    "jsonschema>=4.20.0",
    "pyyaml>=6.0.1",
]

[project.scripts]
pep-admet = "pep_admet.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pep_admet"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q"
